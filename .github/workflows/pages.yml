name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'README.md' --exclude 'ai-music-lab' ./ _site/
          {
            echo '<!doctype html><meta charset="utf-8"><title>DJ Jesse Jay — Demos</title><h1>DJ Jesse Jay — Demos</h1><ul>'
            for d in _site/*/; do
              n=$(basename "$d")
              [ -f "$d/index.html" ] && echo "<li><a href=\"$n/\">$n</a></li>"
            done
            echo '</ul>'
          } > _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
